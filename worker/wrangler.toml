# Deploy with:  npx wrangler login  &&  npx wrangler deploy
#
# A Worker of its own rather than websoccer's, webtennis's, webracing's or
# webtype's, on purpose. The board lives in a single Durable Object under one
# key, so one Worker serving every game would mean one table with football,
# tennis, lap times, scores and road times mixed into it. Five Workers, five
# boards - and they can still post into the same Discord channel, because that
# is only a webhook address.

name = "webtrack"
main = "index.js"
compatibility_date = "2025-04-01"

# Not a secret, so it lives here rather than in `wrangler secret put`. It is what
# the Discord post links to, and it is the one thing worth changing if you host
# the game somewhere other than GitHub Pages.
[vars]
GAME_URL = "https://markclausing.github.io/webtrack/"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
